services:
  nginx:
    container_name: shlink_nginx
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - shlink
    networks:
      - shlink_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
